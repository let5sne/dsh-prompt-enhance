<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Composer with a magic wand control beside the model selector and a rewritten draft">
  <defs>
    <linearGradient id="pe-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="pe-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#3f5bd8"/>
    </linearGradient>
  </defs>

  <!-- canvas: kept readable in light and dark themes by using mid-tone fills only -->
  <rect x="0" y="0" width="640" height="300" fill="#8a8f9a" opacity="0.12"/>
  <rect x="24" y="24" width="272" height="252" rx="16" fill="url(#pe-card)" stroke="#8a8f9a" stroke-opacity="0.5"/>

  <!-- before: one short rough line in the editor -->
  <rect x="48" y="56" width="150" height="10" rx="5" fill="#8a8f9a" opacity="0.75"/>
  <rect x="48" y="78" width="96" height="10" rx="5" fill="#8a8f9a" opacity="0.55"/>

  <!-- tool row: plus, star (highlighted), model pill, send -->
  <rect x="48" y="216" width="28" height="28" rx="8" fill="#8a8f9a" opacity="0.28"/>
  <rect x="140" y="212" width="36" height="36" rx="10" fill="url(#pe-star)" opacity="0.24"/>
  <g transform="translate(146 218)" fill="none" stroke="url(#pe-star)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
