    <path d="m17 2 1.2 3.8L22 7l-3.8 1.2L17 12l-1.2-3.8L12 7l3.8-1.2Z"/>
    <path d="M6 3v4 M4 5h4"/>
  </g>
  <rect x="192" y="220" width="44" height="20" rx="10" fill="#8a8f9a" opacity="0.3"/>
  <rect x="252" y="216" width="28" height="28" rx="8" fill="#8a8f9a" opacity="0.45"/>

  <!-- arrow: draft goes to the model -->
  <path d="M300 150h28" stroke="#8a8f9a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
  <path d="M324 143l8 7-8 7" fill="none" stroke="#8a8f9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- after: a longer, structured prompt -->
  <rect x="344" y="24" width="272" height="252" rx="16" fill="url(#pe-card)" stroke="#8a8f9a" stroke-opacity="0.5"/>
  <rect x="368" y="52" width="120" height="10" rx="5" fill="#8a8f9a" opacity="0.75"/>
  <rect x="368" y="76" width="216" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="92" width="188" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
