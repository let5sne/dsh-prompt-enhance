<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Composer with a star control beside the model selector and a rewritten draft">
  <defs>
    <linearGradient id="pe-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="pe-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#3f5bd8"/>
    </linearGradient>
  </defs>

  <!-- canvas: kept readable in light and dark themes by using mid-tone fills only -->
  <rect x="0" y="0" width="640" height="300" fill="#8a8f9a" opacity="0.12"/>
  <rect x="24" y="24" width="272" height="252" rx="16" fill="url(#pe-card)" stroke="#8a8f9a" stroke-opacity="0.5"/>

  <!-- before: one short rough line in the editor -->
  <rect x="48" y="56" width="150" height="10" rx="5" fill="#8a8f9a" opacity="0.75"/>
  <rect x="48" y="78" width="96" height="10" rx="5" fill="#8a8f9a" opacity="0.55"/>

  <!-- tool row: plus, star (highlighted), model pill, send -->
  <rect x="48" y="216" width="28" height="28" rx="8" fill="#8a8f9a" opacity="0.28"/>
  <rect x="140" y="212" width="36" height="36" rx="10" fill="url(#pe-star)" opacity="0.24"/>
  <path d="M158 217.5l3.1 7.1 7.7.8-5.8 5.2 1.6 7.6-6.6-3.9-6.6 3.9 1.6-7.6-5.8-5.2 7.7-.8z"
        fill="url(#pe-star)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="192" y="220" width="44" height="20" rx="10" fill="#8a8f9a" opacity="0.3"/>
  <rect x="252" y="216" width="28" height="28" rx="8" fill="#8a8f9a" opacity="0.45"/>

  <!-- arrow: draft goes to the model -->
  <path d="M300 150h28" stroke="#8a8f9a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
  <path d="M324 143l8 7-8 7" fill="none" stroke="#8a8f9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- after: a longer, structured prompt -->
  <rect x="344" y="24" width="272" height="252" rx="16" fill="url(#pe-card)" stroke="#8a8f9a" stroke-opacity="0.5"/>
  <rect x="368" y="52" width="120" height="10" rx="5" fill="#8a8f9a" opacity="0.75"/>
  <rect x="368" y="76" width="216" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="92" width="188" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="116" width="88" height="8" rx="4" fill="#8a8f9a" opacity="0.65"/>
  <rect x="368" y="132" width="204" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="148" width="160" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="172" width="88" height="8" rx="4" fill="#8a8f9a" opacity="0.65"/>
  <rect x="368" y="188" width="196" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="204" width="132" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="220" width="44" height="20" rx="10" fill="url(#pe-star)" opacity="0.3"/>
  <path d="M378 226.5l2.6 5.9 6.4.7-4.8 4.3 1.3 6.3-5.5-3.2-5.5 3.2 1.3-6.3-4.8-4.3 6.4-.7z"
        fill="url(#pe-star)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.1" stroke-linejoin="round"/>
  <rect x="508" y="216" width="28" height="28" rx="8" fill="#8a8f9a" opacity="0.45"/>
</svg>