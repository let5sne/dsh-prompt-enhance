  <rect x="368" y="132" width="204" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="148" width="160" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="172" width="88" height="8" rx="4" fill="#8a8f9a" opacity="0.65"/>
  <rect x="368" y="188" width="196" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="204" width="132" height="8" rx="4" fill="#8a8f9a" opacity="0.5"/>
  <rect x="368" y="220" width="44" height="20" rx="10" fill="url(#pe-star)" opacity="0.3"/>
  <g transform="translate(380 220) scale(.83)" fill="none" stroke="url(#pe-star)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
